<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#17181b">
<meta name="description" content="Nected — simulador visual de redes para treinar roteador, switch, load balance, CFTV, VoIP e crimpagem.">
<title>Nected — Simulador de Redes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
 <header id="top">
  <div class="logo"><svg viewBox="0 0 30 22" fill="none" stroke="#5b8cff" stroke-width="2.2" stroke-linecap="round"><path d="M2 11h5l3-8 5 16 4-11 2 3h7"/></svg>Nected</div>
  <button class="tbtn" id="bLabs" title="Meus laboratórios"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4zM3 12l9 4 9-4M3 17l9 4 9-4"/></svg><span class="hidem">Laboratórios</span></button>
  <div class="tsp"></div>
  <input id="pname" value="Meu laboratório" aria-label="Nome do laboratório">
  <div class="tsp"></div>
  <span id="saved" class="hidem">Salvo</span>
  <button class="tbtn" id="bUndo" title="Desfazer (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="tbtn" id="bRedo" title="Refazer (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <button class="tbtn" id="bExport" title="Exportar"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 15v5h16v-5"/></svg><span class="hidem">Exportar</span></button>
  <button class="tbtn" id="bImport" title="Importar"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 15v5h16v-5"/></svg><span class="hidem">Importar</span></button>
 </header>
 <main id="stage">
  <div id="canvas"><div id="world"><svg id="links"></svg><div id="nodes"></div><div id="fx"></div></div></div>
  <div id="modebar" class="float">
   <button class="mbtn on" data-mode="rt"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Tempo real</button>
   <button class="mbtn" data-mode="sim"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4M9 2h6"/></svg>Simulação</button>
   <button class="mbtn" id="ptoggle" title="Painel"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
  </div>
  <div id="tools" class="float">
   <button class="tool on" data-tool="select" data-tip="Selecionar / mover (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></svg></button>
   <button class="tool" data-tool="cable" data-tip="Conectar cabo (C)"><svg viewBox="0 0 24 24"><path d="M7 3v5M17 3v5M5 8h4v4H5zM15 8h4v4h-4zM7 12v3a5 5 0 0 0 10 0v-3"/></svg></button>
   <button class="tool" data-tool="delete" data-tip="Excluir (Del)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></button>
   <div class="sep"></div>
   <button class="tool" data-act="zin" data-tip="Aproximar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5M8 11h6M11 8v6"/></svg></button>
   <button class="tool" data-act="zout" data-tip="Afastar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5M8 11h6"/></svg></button>
   <button class="tool" data-act="fit" data-tip="Enquadrar tudo"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
   <div class="sep"></div>
   <button class="tool" data-act="crimp" data-tip="Bancada de crimpagem"><svg viewBox="0 0 24 24"><path d="M4 20l6-6M10 14l2-6 4-4 4 4-4 4-6 2zM14 6l4 4"/></svg></button>
   <button class="tool" data-act="sample" data-tip="Carregar cenário exemplo"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 9h16M9 9v11"/></svg></button>
   <button class="tool" data-act="clear" data-tip="Limpar tudo"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
  </div>
  <div id="dock" class="float"><div class="cats"></div><div class="items"></div></div>
  <aside id="sim" class="float">
   <h3>Painel de Simulação <span class="ptabs"><button class="ptab on" data-pt="ev">Eventos</button><button class="ptab" data-pt="mis">Missões</button></span></h3>
   <div id="pEv" style="display:flex;flex-direction:column;gap:10px;min-height:0">
    <div class="sub" id="simInfo">Tempo real: os pacotes andam sozinhos.</div>
    <div class="play">
     <button class="pbtn" id="pReset" title="Reiniciar"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 5l-9 7 9 7z"/></svg></button>
     <button class="pbtn big" id="pPlay" title="Play/Pause"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
     <button class="pbtn" id="pNext" title="Próximo passo"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 5l9 7-9 7z"/></svg></button>
    </div>
    <div class="speed" id="speedRow" style="display:none">Velocidade <input type="range" id="speed" min="0.3" max="3" step="0.1" value="1"></div>
    <div class="evhead"><span>Lista de eventos</span><button class="link" id="evClear">Limpar</button></div>
    <div class="evbox"><table><thead><tr><th>Tempo(s)</th><th>Último</th><th>Em</th><th>Tipo</th><th></th></tr></thead><tbody id="evBody"></tbody></table></div>
    <div class="evhead"><span>Filtro de eventos</span></div>
    <div class="filters" id="filters"></div>
   </div>
   <div id="pMis" style="display:none;overflow:auto"></div>
  </aside>
  <div id="hint" class="float"></div>
  <div id="linkpop" class="float"></div>
  <div id="wins"></div>
  <div id="taskbar"></div>
  <div id="toasts"></div>
 </main>
</div>
<div id="modal"><div class="mbox"></div></div>
<noscript><p style="padding:20px">O Nected precisa de JavaScript ativado.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
